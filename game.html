<!DOCTYPE html>
<html>
<head>
<title>Pixel Car Racing - Coconut Edition</title>
<style>
  body { margin: 0; overflow: hidden; background: #111; font-family: 'Courier New', monospace; }
  #gameContainer { position: relative; width: 400px; margin: 20px auto; text-align: center; }
  #gameCanvas { display: block; background: #388E3C; border: 4px solid #fff; box-shadow: 0 0 15px rgba(255,255,255,0.2); margin: 0 auto; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="400" height="600"></canvas>
</div>
<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  let carX, carY, carWidth, carHeight, carSpeed;
  let obstacleX, obstacleY, obstacleWidth, obstacleHeight, obstacleSpeed, obstacleColor;
  let score, highScore, gameOver;
  let rightPressed, leftPressed;
  let trees = [];

  function initGame() {
    carX = 175;
    carY = 480;
    carWidth = 50;
    carHeight = 90;
    carSpeed = 7;
    
    spawnObstacle();
    initTrees();
    
    score = 0;
    highScore = localStorage.getItem("highScore") || 0;
    gameOver = false;
    rightPressed = false;
    leftPressed = false;
  }

  function initTrees() {
    trees = [];
    for (let i = 0; i < 6; i++) {
      trees.push({
        x1: 15, 
        x2: 355, 
        y: i * 120 - 100
      });
    }
  }

  function spawnObstacle() {
    const obstacleTypes = [
      { w: 50, h: 90, speed: 5, color: '#2196F3' },   
      { w: 60, h: 120, speed: 3.5, color: '#FF9800' }, 
      { w: 60, h: 140, speed: 3, color: '#4CAF50' }    
    ];
    const randomIndex = Math.floor(Math.random() * obstacleTypes.length);
    const type = obstacleTypes[randomIndex];

    obstacleX = Math.floor(Math.random() * (280 - type.w)) + 60; 
    obstacleY = -150;
    obstacleWidth = type.w;
    obstacleHeight = type.h;
    obstacleSpeed = type.speed;
    obstacleColor = type.color;
  }

  document.addEventListener("keydown", keyDownHandler);
  document.addEventListener("keyup", keyUpHandler);

  function keyDownHandler(e) {
    if(e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
    else if(e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
  }

  function keyUpHandler(e) {
    if(e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
    else if(e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
  }

  function drawRoad() {
    ctx.fillStyle = "#388E3C";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#424242";
    ctx.fillRect(50, 0, 300, canvas.height);
    
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 4;
    ctx.strokeRect(50, 0, 300, canvas.height);

    ctx.beginPath();
    ctx.setLineDash([30, 30]);
    ctx.moveTo(200, 0);
    ctx.lineTo(200, 600);
    ctx.strokeStyle = "#FFFF00";
    ctx.lineWidth = 6;
    ctx.stroke();
    // Reset line dash for other drawings
    ctx.setLineDash([]);
  }

  function drawCoconutTree(x, y) {
    ctx.fillStyle = "#795548";
    ctx.fillRect(x, y, 10, 40);
    
    ctx.fillStyle = "#2E7D32";
    ctx.beginPath();
    ctx.arc(x + 5, y, 20, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#3E2723";
    ctx.beginPath();
    ctx.arc(x + 3, y + 10, 4, 0, Math.PI * 2);
    ctx.arc(x + 7, y + 15, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  function updateAndDrawTrees() {
    for (let tree of trees) {
      drawCoconutTree(tree.x1, tree.y);
      drawCoconutTree(tree.x2, tree.y);

      tree.y += carSpeed; 

      if (tree.y > canvas.height) {
        tree.y = -100;
      }
    }
  }

  function drawPlayerCar() {
    ctx.save();
    ctx.translate(carX, carY);
    ctx.fillStyle = "#d32f2f";
    ctx.fillRect(0, 0, carWidth, carHeight);
    ctx.fillStyle = "#90caf9";
    ctx.fillRect(5, 20, carWidth - 10, 25);
    ctx.fillStyle = "#fff";
    ctx.fillRect(carWidth/2 - 5, 0, 10, carHeight);
    ctx.restore();
  }

  function drawObstacle() {
    ctx.save();
    ctx.translate(obstacleX, obstacleY);
    ctx.fillStyle = obstacleColor;
    ctx.fillRect(0, 0, obstacleWidth, obstacleHeight);
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.fillRect(5, 10, obstacleWidth - 10, 20);
    ctx.restore();
  }

  function collisionDetection() {
    if (carX < obstacleX + obstacleWidth &&
        carX + carWidth > obstacleX &&
        carY < obstacleY + obstacleHeight &&
        carY + carHeight > obstacleY) {
      gameOver = true;
      if (score > highScore) {
        highScore = score;
        localStorage.setItem("highScore", highScore);
      }
    }
  }

  function draw() {
    drawRoad();
    updateAndDrawTrees();

    if(gameOver) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = "#ff3333";
      ctx.font = "bold 50px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.fillText("CRASH!", canvas.width/2, 220);
      
      ctx.fillStyle = "#fff";
      ctx.font = "30px 'Courier New', monospace";
      ctx.fillText("GAME OVER", canvas.width/2, 280);
      ctx.font = "20px 'Courier New', monospace";
      ctx.fillText("Refresh to Play Again", canvas.width/2, 340);
    } else {
      drawPlayerCar();
      drawObstacle();
      
      collisionDetection();

      obstacleY += obstacleSpeed;
      if(obstacleY > canvas.height) {
        spawnObstacle();
        score++;
        obstacleSpeed += 0.1;
      }

      if(rightPressed && carX < 350 - carWidth) carX += carSpeed;
      if(leftPressed && carX > 50) carX -= carSpeed;
    }

    ctx.fillStyle = "#fff";
    ctx.font = "20px 'Courier New', monospace";
    ctx.textAlign = "left";
    ctx.fillText("Score: " + score, 20, 40);
    ctx.fillText("High Score: " + highScore, 20, 70);

    if(!gameOver) {
      requestAnimationFrame(draw);
    }
  }

  initGame();
  draw();
</script>
</body>
</html>
