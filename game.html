
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTX Pixel Car Racing</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #050914;
  color: white;
  font-family: monospace;
  text-align: center;
}

h2 {
  color: #00f5ff;
  text-shadow: 0 0 15px #00f5ff;
  margin: 15px;
}

canvas {
  width: min(400px, 96vw);
  height: auto;
  border: 3px solid #00f5ff;
  box-shadow: 0 0 25px #00eaff;
  image-rendering: pixelated;
  background: #050914;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 12px;
}

button {
  padding: 13px 20px;
  border: 2px solid #00f5ff;
  border-radius: 10px;
  background: #071c31;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 12px #00dfff66;
  touch-action: none;
}

button:active {
  background: #00bcd4;
}

#nitro {
  border-color: #ff9800;
  color: #ffb74d;
}

#rtx {
  color: #00ffae;
}

#restart {
  background: #b71c1c;
}

p { color: #9befff; }
</style>
</head>

<body>

<h2>🏎️ RTX PIXEL CAR RACING 🌴</h2>

<canvas id="game" width="400" height="600"></canvas>

<div class="controls">
  <button id="left">⬅️ LEFT</button>
  <button id="right">RIGHT ➡️</button>
</div>

<div class="controls">
  <button id="nitro">🔥 NITRO</button>
  <button id="rtx">⚡ RTX ON</button>
</div>

<button id="restart">🔄 RESTART GAME</button>

<p>Keyboard: Arrow Keys / A / D</p>
<p>Press SPACE for Nitro</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = 400, H = 600;

let player = { x: 175, y: 470, w: 48, h: 90 };
let enemies = [];
let trees = [];
let particles = [];

let score = 0;
let best = Number(localStorage.getItem("rtxBest")) || 0;
let speed = 4;
let roadLine = 0;
let spawnTimer = 0;
let gameOver = false;
let rtx = true;
let nitro = false;
let nitroTime = 0;
let left = false;
let right = false;
let lastTime = 0;

const playerSprite = [
"....RRRR....",
"...RWWWWR...",
"..RRRRRRRR..",
"..RCCCCCCR..",
"..RCCCCCCR..",
"..RRRRRRRR..",
"..RRRRRRRR..",
"..RCCCCCCR..",
"..RCCCCCCR..",
"..RRRRRRRR..",
"..RRRRRRRR..",
".BBRRRRRRBB.",
".BBRRRRRRBB.",
"..RRRRRRRR..",
"..RRRRRRRR..",
"..RRRRRRRR..",
"...RR..RR...",
"...BB..BB..."
];

const enemySprite = [
"....BBBB....",
"...BWWWWB...",
"..BBBBBBBB..",
"..BCCCCCCB..",
"..BCCCCCCB..",
"..BBBBBBBB..",
"..BBBBBBBB..",
"..BCCCCCCB..",
"..BCCCCCCB..",
"..BBBBBBBB..",
"..BBBBBBBB..",
".BBBRRRRBBB.",
".BBBRRRRBBB.",
"..BBBBBBBB..",
"..BBBBBBBB..",
"..BBBBBBBB..",
"...BB..BB...",
"...BB..BB..."
];

const playerColors = {
  R: "#e53935",
  W: "#ffffff",
  C: "#80d8ff",
  B: "#111111"
};

const enemyColors = {
  B: "#1565c0",
  W: "#ffffff",
  C: "#90caf9",
  R: "#111111"
};

// PIXEL CAR DRAWING
function drawCar(sprite, x, y, colors, glow) {
  ctx.save();

  sprite.forEach((row, ry) => {
    [...row].forEach((char, rx) => {
      if (char === ".") return;

      ctx.fillStyle = colors[char] || "white";

      if (rtx) {
        ctx.shadowColor = glow;
        ctx.shadowBlur = 12;
      } else {
        ctx.shadowBlur = 0;
      }

      ctx.fillRect(
        x + rx * 4,
        y + ry * 4,
        4, 4
      );
    });
  });

  ctx.restore();
}

// ROAD
function drawRoad(dt) {
  const bg = ctx.createLinearGradient(0, 0, 400, 0);
  bg.addColorStop(0, "#031e14");
  bg.addColorStop(.5, "#101820");
  bg.addColorStop(1, "#031e14");

  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Grass
  ctx.fillStyle = "#062b20";
  ctx.fillRect(0, 0, 50, H);
  ctx.fillRect(350, 0, 50, H);

  // Road
  const road = ctx.createLinearGradient(50, 0, 350, 0);
  road.addColorStop(0, "#111827");
  road.addColorStop(.5, "#303744");
  road.addColorStop(1, "#111827");

  ctx.fillStyle = road;
  ctx.fillRect(50, 0, 300, H);

  // Neon road borders
  ctx.save();
  ctx.shadowColor = rtx ? "#00f5ff" : "transparent";
  ctx.shadowBlur = rtx ? 15 : 0;
  ctx.fillStyle = "#00eaff";
  ctx.fillRect(49, 0, 3, H);
  ctx.fillRect(348, 0, 3, H);
  ctx.restore();

  // Road reflections
  for (let i = 0; i < 7; i++) {
    let y = (i * 100 + roadLine * 2) % H;

    const gradient = ctx.createLinearGradient(70, y, 330, y);
    gradient.addColorStop(0, "transparent");
    gradient.addColorStop(.5, "rgba(0,240,255,.18)");
    gradient.addColorStop(1, "transparent");

    ctx.fillStyle = gradient;
    ctx.fillRect(65, y, 270, 3);
  }

  // Center lane
  ctx.fillStyle = "#ffe600";

  for (let y = -50; y < H; y += 80) {
    ctx.fillRect(198, y + roadLine, 5, 40);
  }

  roadLine = (roadLine + speed * (nitro ? 2 : 1) * dt) % 80;
}

// TREES
function createTrees() {
  trees = [];

  for (let i = 0; i < 7; i++) {
    trees.push({ x: 10, y: i * 100 - 100 });
    trees.push({ x: 365, y: i * 100 - 100 });
  }
}

function drawTree(x, y) {
  ctx.fillStyle = "#69452b";
  ctx.fillRect(x + 9, y + 15, 10, 35);

  ctx.fillStyle = "#087b35";
  ctx.fillRect(x, y, 28, 25);
  ctx.fillRect(x - 7, y + 8, 42, 12);

  if (rtx) {
    ctx.shadowColor = "#00ff66";
    ctx.shadowBlur = 12;
  }

  ctx.fillStyle = "#18b84e";
  ctx.fillRect(x + 5, y - 5, 8, 8);

  ctx.shadowBlur = 0;
}

// HEADLIGHTS
function drawHeadlights() {
  ctx.save();

  if (rtx) {
    ctx.globalCompositeOperation = "lighter";

    const beam = ctx.createRadialGradient(
      player.x + 24, player.y,
      2,
      player.x + 24, player.y - 100,
      120
    );

    beam.addColorStop(0, "rgba(0,230,255,.16)");
    beam.addColorStop(1, "rgba(0,230,255,0)");

    ctx.fillStyle = beam;
    ctx.fillRect(player.x - 90, player.y - 180, 230, 180);
  }

  ctx.restore();
}

// ENEMIES
function spawnEnemy() {
  const lanes = [80, 175, 270];
  const lane = lanes[Math.floor(Math.random() * lanes.length)];

  enemies.push({
    x: lane,
    y: -100,
    speed: speed + Math.random() * 1.5,
    color: Math.random() > .5 ? "blue" : "orange"
  });
}

function drawEnemies() {
  enemies.forEach(e => {
    const colors = e.color === "blue"
      ? enemyColors
      : {
          B: "#ef6c00",
          W: "#ffffff",
          C: "#ffcc80",
          R: "#111111"
        };

    drawCar(enemySprite, e.x, e.y, colors,
      e.color === "blue" ? "#00aaff" : "#ff7700");
  });
}

// NITRO EFFECT
function drawNitro() {
  if (!nitro) return;

  ctx.save();

  ctx.shadowColor = "#00ccff";
  ctx.shadowBlur = 20;

  const flame = ctx.createLinearGradient(
    0, player.y + 70, 0, player.y + 120
  );

  flame.addColorStop(0, "#ffffff");
  flame.addColorStop(.3, "#00e5ff");
  flame.addColorStop(1, "transparent");

  ctx.fillStyle = flame;

  ctx.fillRect(player.x + 12, player.y + 72, 8, 40);
  ctx.fillRect(player.x + 29, player.y + 72, 8, 40);

  ctx.restore();
}

// PARTICLES
function addParticle(x, y) {
  particles.push({
    x: x + Math.random() * 30,
    y,
    life: 1,
    vx: Math.random() * 2 - 1,
    vy: Math.random() * 3 + 1
  });
}

function drawParticles(dt) {
  particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= .025 * dt;

    ctx.fillStyle = `rgba(0,230,255,${Math.max(0,p.life)})`;
    ctx.fillRect(p.x, p.y, 3, 3);
  });

  particles = particles.filter(p => p.life > 0);
}

// COLLISION
function collision(a, b) {
  return (
    a.x + 8 < b.x + 40 &&
    a.x + a.w - 8 > b.x + 8 &&
    a.y + 10 < b.y + 70 &&
    a.y + a.h - 10 > b.y + 10
  );
}

// UI
function drawUI() {
  ctx.save();

  ctx.font = "bold 18px monospace";
  ctx.textAlign = "left";
  ctx.fillStyle = "#ffffff";

  ctx.shadowColor = "#00eaff";
  ctx.shadowBlur = rtx ? 10 : 0;

  ctx.fillText("SCORE: " + score, 12, 28);
  ctx.fillText("BEST: " + best, 12, 52);

  ctx.restore();

  if (nitro) {
    ctx.fillStyle = "#00eaff";
    ctx.font = "bold 17px monospace";
    ctx.fillText("NITRO BOOST!", 125, 35);
  }
}

// GAME OVER
function drawGameOver() {
  ctx.fillStyle = "rgba(0,0,0,.85)";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";

  ctx.fillStyle = "#ff3333";
  ctx.font = "bold 42px monospace";
  ctx.fillText("CRASH!", 200, 230);

  ctx.fillStyle = "#ffffff";
  ctx.font = "24px monospace";
  ctx.fillText("GAME OVER", 200, 285);

  ctx.font = "20px monospace";
  ctx.fillText("SCORE: " + score, 200, 335);
  ctx.fillText("PRESS RESTART", 200, 390);
}

// UPDATE
function update(dt) {
  if (nitro) {
    nitroTime -= dt;
    if (nitroTime <= 0) nitro = false;
  }

  let frame = Math.min(dt / 16.67, 2);

  let currentSpeed = speed * (nitro ? 1.8 : 1);

  if (left) player.x -= 6 * frame;
  if (right) player.x += 6 * frame;

  player.x = Math.max(55, Math.min(297, player.x));

  enemies.forEach(e => {
    e.y += (e.speed + (nitro ? 2 : 0)) * frame;
  });

  enemies = enemies.filter(e => {
    if (e.y > H) {
      score++;
      speed = Math.min(10, 4 + score * .12);
      return false;
    }
    return true;
  });

  enemies.forEach(e => {
    if (collision(player, e)) {
      gameOver = true;

      if (score > best) {
        best = score;
        localStorage.setItem("rtxBest", best);
      }
    }
  });

  trees.forEach(t => {
    t.y += currentSpeed * frame;
    if (t.y > H) t.y = -60;
  });

  if (nitro && Math.random() > .5) {
    addParticle(player.x + 10, player.y + 90);
  }

  drawParticles(frame);
}

// MAIN GAME LOOP
function loop(timestamp) {
  const dt = lastTime
    ? Math.min(timestamp - lastTime, 40)
    : 16.67;

  lastTime = timestamp;

  drawRoad(dt);

  trees.forEach(t => drawTree(t.x, t.y));

  drawHeadlights();

  if (!gameOver) {
    update(dt);

    spawnTimer += dt;

    if (spawnTimer > Math.max(650, 1400 - score * 15)) {
      spawnEnemy();
      spawnTimer = 0;
    }
  }

  drawEnemies();
  drawNitro();

  drawCar(
    playerSprite,
    player.x,
    player.y,
    playerColors,
    "#ff1744"
  );

  drawUI();

  if (gameOver) drawGameOver();

  requestAnimationFrame(loop);
}

// CONTROLS
document.addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", " "].includes(e.key)) {
    e.preventDefault();
  }

  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a")
    left = true;

  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d")
    right = true;

  if (e.code === "Space" && !e.repeat && !gameOver) {
    nitro = true;
    nitroTime = 1500;
  }
});

document.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a")
    left = false;

  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d")
    right = false;
});

function setupButton(id, direction) {
  const btn = document.getElementById(id);

  btn.addEventListener("pointerdown", e => {
    e.preventDefault();

    if (direction === "left") left = true;
    if (direction === "right") right = true;
    if (direction === "nitro" && !gameOver) {
      nitro = true;
      nitroTime = 1500;
    }
  });

  ["pointerup", "pointerleave", "pointercancel"].forEach(event => {
    btn.addEventListener(event, () => {
      if (direction === "left") left = false;
      if (direction === "right") right = false;
      if (direction === "nitro") nitro = false;
    });
  });
}

setupButton("left", "left");
setupButton("right", "right");
setupButton("nitro", "nitro");

// RTX TOGGLE
document.getElementById("rtx").onclick = () => {
  rtx = !rtx;

  document.getElementById("rtx").textContent =
    rtx ? "⚡ RTX ON" : "⚡ RTX OFF";
};

// RESTART
function restartGame() {
  player.x = 175;
  enemies = [];
  particles = [];
  score = 0;
  speed = 4;
  roadLine = 0;
  spawnTimer = 0;
  nitro = false;
  nitroTime = 0;
  gameOver = false;
  lastTime = 0;
  left = false;
  right = false;
  createTrees();
}

document.getElementById("restart").onclick = restartGame;

createTrees();
requestAnimationFrame(loop);

</script>
</body>
</html>
