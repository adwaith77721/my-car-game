
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Car Racing</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101820;
  color: white;
  font-family: monospace;
  text-align: center;
}
h2 { color: #00ffcc; }
#gameContainer { width: 100%; padding: 10px; }
canvas {
  width: min(400px, 96vw);
  height: auto;
  border: 4px solid white;
  background: #388e3c;
  image-rendering: pixelated;
  box-shadow: 0 0 20px #00ffcc55;
}
.controls {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin: 15px;
}
button {
  background: #00c853;
  border: 2px solid white;
  color: white;
  padding: 15px 30px;
  font-size: 22px;
  font-weight: bold;
  border-radius: 10px;
  cursor: pointer;
  touch-action: none;
}
button:active { background: #ff9800; }
#restart { background: #e53935; font-size: 16px; }
</style>
</head>
<body>

<h2>🏎️ PIXEL CAR RACING 🌴</h2>
<div id="gameContainer">
  <canvas id="gameCanvas" width="400" height="600"></canvas>

  <div class="controls">
    <button id="left">⬅️</button>
    <button id="right">➡️</button>
  </div>
  <button id="restart">🔄 RESTART GAME</button>
  <p>Keyboard: ← → or A / D</p>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const W = 400, H = 600;
const roadLeft = 50, roadRight = 350;

let player = { x: 175, y: 475, w: 48, h: 90 };
let enemies = [];
let trees = [];
let score = 0;
let highScore = Number(localStorage.getItem("pixelHighScore")) || 0;
let speed = 4;
let gameOver = false;
let leftPressed = false;
let rightPressed = false;
let lastTime = 0;
let roadLine = 0;

// Pixel art car sprites
const playerSprite = [
"....RRRR....",
"...RWWWWR...",
"..RRRRRRRR..",
"..RCCCCCCR..",
"..RCCCCCCR..",
"..RRRRRRRR..",
"..RRRRRRRR..",
"..RCCCCCCR..",
"..RCCCCCCR..",
"..RRRRRRRR..",
"..RRRRRRRR..",
".BBRRRRRRBB.",
".BBRRRRRRBB.",
"..RRRRRRRR..",
"..RRRRRRRR..",
"..RRRRRRRR..",
"...RR..RR...",
"...BB..BB..."
];

const enemySprite = [
"....BBBB....",
"...BWWWWB...",
"..BBBBBBBB..",
"..BCCCCCCB..",
"..BCCCCCCB..",
"..BBBBBBBB..",
"..BBBBBBBB..",
"..BCCCCCCB..",
"..BCCCCCCB..",
"..BBBBBBBB..",
"..BBBBBBBB..",
".BBBRRRRBBB.",
".BBBRRRRBBB.",
"..BBBBBBBB..",
"..BBBBBBBB..",
"..BBBBBBBB..",
"...BB..BB...",
"...BB..BB..."
];

function drawPixelCar(sprite, x, y, scale, colors) {
  const pixel = 4;
  sprite.forEach((row, ry) => {
    [...row].forEach((char, rx) => {
      if (char === ".") return;
      ctx.fillStyle = colors[char] || "#fff";
      ctx.fillRect(
        x + rx * pixel * scale,
        y + ry * pixel * scale,
        pixel * scale,
        pixel * scale
      );
    });
  });
}

const playerColors = {
  R: "#e53935",
  W: "#ffffff",
  C: "#80d8ff",
  B: "#151515"
};

const enemyColors = {
  B: "#1565c0",
  W: "#ffffff",
  C: "#90caf9",
  R: "#111111"
};

function createTrees() {
  trees = [];
  for (let i = 0; i < 7; i++) {
    trees.push({ x: 15, y: i * 110 - 100 });
    trees.push({ x: 365, y: i * 110 - 100 });
  }
}

function drawTree(x, y) {
  ctx.fillStyle = "#795548";
  ctx.fillRect(x + 8, y + 15, 10, 35);

  ctx.fillStyle = "#2e7d32";
  ctx.fillRect(x, y, 28, 25);
  ctx.fillRect(x - 7, y + 8, 42, 12);

  ctx.fillStyle = "#4caf50";
  ctx.fillRect(x + 5, y - 5, 8, 8);

  ctx.fillStyle = "#5d4037";
  ctx.fillRect(x + 8, y + 15, 5, 5);
  ctx.fillRect(x + 17, y + 19, 5, 5);
}

function drawRoad() {
  ctx.fillStyle = "#388e3c";
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = "#424242";
  ctx.fillRect(50, 0, 300, H);

  ctx.fillStyle = "#fff";
  ctx.fillRect(48, 0, 4, H);
  ctx.fillRect(348, 0, 4, H);

  ctx.fillStyle = "#ffeb3b";
  for (let y = -40; y < H; y += 80) {
    ctx.fillRect(198, y + roadLine, 5, 40);
  }

  roadLine += speed;
  if (roadLine >= 80) roadLine = 0;
}

function spawnEnemy() {
  const lanes = [80, 175, 270];
  const lane = lanes[Math.floor(Math.random() * lanes.length)];

  enemies.push({
    x: lane,
    y: -100,
    speed: speed + Math.random() * 2,
    color: Math.random() > 0.5 ? "blue" : "orange"
  });
}

function drawEnemies() {
  enemies.forEach(enemy => {
    if (enemy.color === "blue") {
      drawPixelCar(enemySprite, enemy.x, enemy.y, 1, enemyColors);
    } else {
      drawPixelCar(enemySprite, enemy.x, enemy.y, 1, {
        B: "#ef6c00",
        W: "#ffffff",
        C: "#ffcc80",
        R: "#111111"
      });
    }
  });
}

function collision(a, b) {
  return (
    a.x + 8 < b.x + 40 &&
    a.x + a.w - 8 > b.x + 8 &&
    a.y + 10 < b.y + 70 &&
    a.y + a.h - 10 > b.y + 10
  );
}

function drawUI() {
  ctx.fillStyle = "#fff";
  ctx.font = "bold 19px monospace";
  ctx.textAlign = "left";
  ctx.fillText("SCORE: " + score, 10, 30);
  ctx.fillText("BEST: " + highScore, 10, 55);
}

function endGame() {
  gameOver = true;
  if (score > highScore) {
    highScore = score;
    localStorage.setItem("pixelHighScore", highScore);
  }
}

function drawGameOver() {
  ctx.fillStyle = "rgba(0,0,0,0.8)";
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = "center";
  ctx.fillStyle = "#ff3333";
  ctx.font = "bold 42px monospace";
  ctx.fillText("CRASH!", 200, 230);

  ctx.fillStyle = "white";
  ctx.font = "25px monospace";
  ctx.fillText("GAME OVER", 200, 285);

  ctx.font = "20px monospace";
  ctx.fillText("Score: " + score, 200, 335);
  ctx.fillText("Press RESTART", 200, 390);
}

function update(delta) {
  const frame = Math.min(delta / 16.67, 2);

  if (leftPressed) player.x -= 6 * frame;
  if (rightPressed) player.x += 6 * frame;

  player.x = Math.max(55, Math.min(297, player.x));

  enemies.forEach(enemy => {
    enemy.y += enemy.speed * frame;
  });

  enemies = enemies.filter(enemy => {
    if (enemy.y > H) {
      score++;
      speed = Math.min(10, 4 + score * 0.12);
      return false;
    }
    return true;
  });

  enemies.forEach(enemy => {
    if (collision(player, enemy)) endGame();
  });

  trees.forEach(tree => {
    tree.y += speed * frame;
    if (tree.y > H) tree.y = -60;
  });
}

let spawnTimer = 0;

function draw(delta = 16.67) {
  drawRoad();

  trees.forEach(tree => drawTree(tree.x, tree.y));

  if (!gameOver) {
    update(delta);

    spawnTimer += delta;
    if (spawnTimer > Math.max(650, 1400 - score * 15)) {
      spawnEnemy();
      spawnTimer = 0;
    }

    drawPixelCar(playerSprite, player.x, player.y, 1, playerColors);
    drawEnemies();
    drawUI();
  } else {
    drawEnemies();
    drawPixelCar(playerSprite, player.x, player.y, 1, playerColors);
    drawUI();
    drawGameOver();
  }
}

function loop(timestamp) {
  const delta = lastTime ? timestamp - lastTime : 16.67;
  lastTime = timestamp;

  if (!gameOver) {
    draw(delta);
    requestAnimationFrame(loop);
  }
}

function restartGame() {
  player.x = 175;
  enemies = [];
  score = 0;
  speed = 4;
  spawnTimer = 0;
  roadLine = 0;
  gameOver = false;
  lastTime = 0;
  createTrees();
  requestAnimationFrame(loop);
}

// Keyboard controls
document.addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", " "].includes(e.key)) {
    e.preventDefault();
  }
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a")
    leftPressed = true;
  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d")
    rightPressed = true;
});

document.addEventListener("keyup", e => {
  if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a")
    leftPressed = false;
  if (e.key === "ArrowRight" || e.key.toLowerCase() === "d")
    rightPressed = false;
});

// Mobile buttons
function setupButton(id, direction) {
  const btn = document.getElementById(id);

  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (direction === "left") leftPressed = true;
    else rightPressed = true;
  });

  ["pointerup", "pointerleave", "pointercancel"].forEach(event => {
    btn.addEventListener(event, () => {
      if (direction === "left") leftPressed = false;
      else rightPressed = false;
    });
  });
}

setupButton("left", "left");
setupButton("right", "right");

document.getElementById("restart").addEventListener("click", restartGame);

createTrees();
requestAnimationFrame(loop);
</script>
</body>
</html>
